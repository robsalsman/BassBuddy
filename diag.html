<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BassBuddy — leaderboard service diagnostic</title>
<style>
  body { background: #06222c; color: #eaf6fb; font: 13px/1.5 ui-monospace, Menlo, monospace; padding: 14px; }
  h1 { font-size: 15px; color: #ffd35c; }
  .t { margin: 14px 0; padding: 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; word-break: break-all; }
  .n { font-weight: 700; color: #8fd8c9; }
  .ok { color: #5be37a; } .bad { color: #ff5d5d; }
</style>
</head>
<body>
<h1>🎣 Leaderboard service diagnostic — screenshot this whole page</h1>
<div id="out">running…</div>
<script>
(async () => {
  const out = document.getElementById("out");
  out.innerHTML = "";
  const show = (name, obj) => {
    const d = document.createElement("div");
    d.className = "t";
    d.innerHTML = `<div class="n">${name}</div><div class="${obj.error ? "bad" : "ok"}">${JSON.stringify(obj)}</div>`;
    out.appendChild(d);
  };
  const probe = async (name, fn) => {
    try { show(name, await fn()); }
    catch (e) { show(name, { error: (e && e.name) + ": " + (e && e.message) }); }
  };

  await probe("1. kvdb.io CREATE (form-encoded POST)", async () => {
    const r = await fetch("https://kvdb.io", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "email=" });
    return { status: r.status, body: (await r.text()).slice(0, 140) };
  });

  await probe("2. kvdb.io CREATE (plain POST)", async () => {
    const r = await fetch("https://kvdb.io", { method: "POST", body: "email=" });
    return { status: r.status, body: (await r.text()).slice(0, 140) };
  });

  await probe("3. kvdb.io GET (CORS reachability)", async () => {
    const r = await fetch("https://kvdb.io/NoSuchBucketProbe123/");
    return { status: r.status, body: (await r.text()).slice(0, 100) };
  });

  await probe("4. jsonblob.com CREATE", async () => {
    const r = await fetch("https://jsonblob.com/api/jsonBlob", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bb: 1 }) });
    return { status: r.status, location: r.headers.get("Location"), body: (await r.text()).slice(0, 100) };
  });

  await probe("5. extendsclass.com CREATE", async () => {
    const r = await fetch("https://json.extendsclass.com/bin", { method: "POST", body: JSON.stringify({ bb: 1 }) });
    return { status: r.status, body: (await r.text()).slice(0, 140) };
  });

  await probe("6. npoint.io CREATE", async () => {
    const r = await fetch("https://api.npoint.io", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: { bb: 1 } }) });
    return { status: r.status, body: (await r.text()).slice(0, 140) };
  });

  await probe("7. dreamlo.com read (CORS)", async () => {
    const r = await fetch("https://www.dreamlo.com/lb/probe/json");
    return { status: r.status, body: (await r.text()).slice(0, 80) };
  });

  // ---- the LIVE board: list shape, write, read-back ----
  const B = "https://kvdb.io/xhguzRgTLvAv2UeWFsn6t/";

  await probe("8. board LIST (raw shape)", async () => {
    const r = await fetch(B + "?values=true&format=json&limit=1000");
    return { status: r.status, body: (await r.text()).slice(0, 300) };
  });

  await probe("9. board LIST (keys only)", async () => {
    const r = await fetch(B);
    return { status: r.status, body: (await r.text()).slice(0, 160) };
  });

  await probe("10. board WRITE (diagtest key)", async () => {
    const r = await fetch(B + "diagtest", { method: "PUT", body: JSON.stringify({ n: "DIAG", s: 1, t: 1 }) });
    return { status: r.status, body: (await r.text()).slice(0, 80) };
  });

  await probe("11. board READ-BACK (diagtest)", async () => {
    const r = await fetch(B + "diagtest");
    return { status: r.status, body: (await r.text()).slice(0, 120) };
  });

  const d = document.createElement("div");
  d.className = "t"; d.innerHTML = `<div class="n">done — online: ${navigator.onLine}</div>`;
  out.appendChild(d);

  // ---- 12. live gamepad monitor: press buttons on the controller and watch ----
  const gp = document.createElement("div");
  gp.className = "t";
  gp.innerHTML = `<div class="n">12. gamepad monitor (pair the controller, then PRESS ANY BUTTON)</div><div id="gpout" class="bad">no gamepad exposed yet — press a button on it</div><div id="gpev"></div>`;
  out.appendChild(gp);
  const ev = msg => { const e = document.createElement("div"); e.className = "ok"; e.textContent = msg; document.getElementById("gpev").appendChild(e); };
  addEventListener("gamepadconnected", e => ev(`connected: "${e.gamepad.id}" mapping=${e.gamepad.mapping || "none"} buttons=${e.gamepad.buttons.length} axes=${e.gamepad.axes.length}`));
  addEventListener("gamepaddisconnected", e => ev(`disconnected: "${e.gamepad.id}"`));
  setInterval(() => {
    const o = document.getElementById("gpout");
    try {
      const pads = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean);
      if (!pads.length) { o.className = "bad"; o.textContent = "no gamepad exposed yet — press a button on it"; return; }
      o.className = "ok";
      o.textContent = pads.map(p => `"${p.id}" mapping=${p.mapping || "none"} | axes: ${[...p.axes].map(a => a.toFixed(2)).join(",")} | pressed: [${p.buttons.map((b, i) => b.pressed ? i : null).filter(x => x !== null).join(",")}]`).join(" || ");
    } catch (e) { o.className = "bad"; o.textContent = "getGamepads threw: " + e.message; }
  }, 250);
})();
</script>
</body>
</html>
